name: Close stale issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security,in-progress"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no activity for
            60 days. It will be closed in 14 days if no further activity occurs. If this is still
            relevant, comment to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has had no
            activity for 60 days. It will be closed in 14 days if no further activity occurs.
          close-issue-message: >
            This issue was closed automatically after 14 days of inactivity following the stale
            warning. Reopen if it's still relevant.
          close-pr-message: >
            This pull request was closed automatically after 14 days of inactivity following the
            stale warning. Reopen or open a fresh PR if this work is still relevant.
