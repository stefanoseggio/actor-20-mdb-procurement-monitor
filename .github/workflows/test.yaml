name: CI

on:
    pull_request:
    push:
        branches: [main, master]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm test
            - name: Verify reproducible build (byte-identity check)
              run: |
                  # tsc's incremental cache (tsconfig.tsbuildinfo) makes a second `tsc`
                  # invocation skip re-emitting files it thinks are already up to date,
                  # even after dist/ is deleted - that would make this check a no-op
                  # false-pass. Both dist/ and the buildinfo cache must be cleared before
                  # each build for this comparison to test anything real.
                  rm -rf dist tsconfig.tsbuildinfo
                  npm run build
                  sha256sum $(find dist -type f | sort) > /tmp/build-hash-1.txt
                  rm -rf dist tsconfig.tsbuildinfo
                  npm run build
                  sha256sum $(find dist -type f | sort) > /tmp/build-hash-2.txt
                  if ! diff -u /tmp/build-hash-1.txt /tmp/build-hash-2.txt; then
                      echo "::error::Build is not reproducible - two consecutive builds from the same source produced different output."
                      exit 1
                  fi
                  echo "Build is byte-identical across two consecutive runs."

    live-smoke-test:
        # Runs this repo's own live-tagged tests (normally skipIf(process.env.CI)-skipped)
        # as an informational PR signal. continue-on-error so a real external site hiccup
        # during CI never blocks a merge - the exact lesson already documented in this
        # fleet's own test files (pba-tenders-monitor, diario-oficial-cl-monitor). This is
        # the only automated check in this repo that can catch a live site behavior change
        # before merge; build-and-test above cannot, by design, since it skips live tests.
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Run live-tagged tests (CI unset so skipIf(process.env.CI) does not skip them)
              run: CI= npm test
